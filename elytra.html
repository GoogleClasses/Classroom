function genusername() {
    const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    let username = document.getElementById("username").value;
    while (username.length < 16) {
        username += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return encoder.encode(username);
}

// 127

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_";
    let thejunk = "";
	while (thejunk.length < l) {
		thejunk += chars.charAt(Math.floor(Math.random() * chars.length));
	}
    return thejunk;
}

function getMsg(text) {
    const construct = new Uint8Array(2 + text.length)
    construct[0] = 0x02
    construct[1] = text.length

function raid(u) {

	trinidad.onopen = function() {
		handshaked(trinidad, u)

	trinidad.onmessage = function(data) {

			login(trinidad, u)
