<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .google-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 24px;
            color: #202124;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .subtitle {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #202124;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #4285f4;
            color: white;
        }

        .btn-primary:hover {
            background-color: #357ae8;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: #4285f4;
            border: 1px solid #4285f4;
        }

        .btn-secondary:hover {
            background-color: #f1f5ff;
        }

        .link-button {
            background: none;
            border: none;
            color: #4285f4;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            padding: 0;
            font-weight: 500;
        }

        .link-button:hover {
            text-decoration: underline;
        }

        .forgot-password-link {
            text-align: right;
            margin-top: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #202124;
            font-weight: 500;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #5f6368;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #202124;
        }

        .error-message {
            color: #d33b27;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container,
            .modal-content {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Main Login Container -->
    <div class="login-container">
        <div class="logo-container">
            <svg class="google-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <!-- Google Logo SVG -->
                <defs>
                    <path id="a" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6.3 1.1 8.7 3.3l6.3-6.3C34.5 5.9 29.6 4 24 4 12.1 4 2 14.1 2 26s10.1 22 22 22c11 0 21-8.9 21-24 0-1.3-.2-2.7-.5-4z"/>
                </defs>
                <clipPath id="b">
                    <use href="#a" overflow="visible"/>
                </clipPath>
                <path d="M0 37.5h48V0H0z" fill="#FBBC04" clip-path="url(#b)"/>
                <defs>
                    <path id="c" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6.3 1.1 8.7 3.3l6.3-6.3C34.5 5.9 29.6 4 24 4 12.1 4 2 14.1 2 26s10.1 22 22 22c11 0 21-8.9 21-24 0-1.3-.2-2.7-.5-4z"/>
                </defs>
                <clipPath id="d">
                    <use href="#c" overflow="visible"/>
                </clipPath>
                <path d="M0 14.5h48v24H0z" fill="#EA4335" clip-path="url(#d)"/>
                <defs>
                    <path id="e" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6.3 1.1 8.7 3.3l6.3-6.3C34.5 5.9 29.6 4 24 4 12.1 4 2 14.1 2 26s10.1 22 22 22c11 0 21-8.9 21-24 0-1.3-.2-2.7-.5-4z"/>
                </defs>
                <clipPath id="f">
                    <use href="#e" overflow="visible"/>
                </clipPath>
                <path d="M15.5 37c5.8 0 10.5-1.9 14-5.1l-6.7-5.2c-1.9 1.3-4.3 2.1-7.3 2.1-5.6 0-10.3-3.8-12-9H2.18v5.3C5.3 34.4 10.1 37 15.5 37z" fill="#34A853" clip-path="url(#f)"/>
                <defs>
                    <path id="g" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6.3 1.1 8.7 3.3l6.3-6.3C34.5 5.9 29.6 4 24 4 12.1 4 2 14.1 2 26s10.1 22 22 22c11 0 21-8.9 21-24 0-1.3-.2-2.7-.5-4z"/>
                </defs>
                <clipPath id="h">
                    <use href="#g" overflow="visible"/>
                </clipPath>
                <path d="M3.5 11.5C1.9 15.2 1 19.4 1 24c0 4.6.9 8.8 2.5 12.5l5.6-4.3c1.5-1.1 2.8-2.5 3.8-4.2H24V20H3.5z" fill="#4285F4" clip-path="url(#h)"/>
            </svg>
            <h1>Google Classroom</h1>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email or username</label>
                <input type="text" id="email" name="email" required placeholder="Enter your email">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="No password required - just click Sign In">
                <div class="forgot-password-link">
                    <button type="button" class="link-button" id="forgotPasswordBtn">Forgot password?</button>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" id="createAccountBtn">Create account</button>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </div>
        </form>
    </div>

    <!-- Create Account Modal -->
    <div class="modal" id="createAccountModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Account</h2>
                <button type="button" class="close-btn" data-modal="createAccountModal">&times;</button>
            </div>
            <form id="createAccountForm">
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" required>
                    <div class="error-message" id="firstNameError"></div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" required>
                    <div class="error-message" id="lastNameError"></div>
                </div>

                <div class="form-group">
                    <label for="newEmail">Email</label>
                    <input type="email" id="newEmail" name="newEmail" required>
                    <div class="error-message" id="newEmailError"></div>
                </div>

                <div class="form-group">
                    <label for="newPassword">Password (optional)</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Leave blank if not needed">
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" data-modal="createAccountModal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotPasswordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Forgot Password?</h2>
                <button type="button" class="close-btn" data-modal="forgotPasswordModal">&times;</button>
            </div>
            <form id="forgotPasswordForm">
                <p style="color: #5f6368; font-size: 14px; margin-bottom: 20px;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <div class="form-group">
                    <label for="resetEmail">Email address</label>
                    <input type="email" id="resetEmail" name="resetEmail" required>
                    <div class="error-message" id="resetEmailError"></div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" data-modal="forgotPasswordModal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Send reset link</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Modal Management
        const createAccountModal = document.getElementById('createAccountModal');
        const forgotPasswordModal = document.getElementById('forgotPasswordModal');
        const createAccountBtn = document.getElementById('createAccountBtn');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const closeButtons = document.querySelectorAll('.close-btn');
        const cancelButtons = document.querySelectorAll('[data-modal]');

        // Open Create Account Modal
        createAccountBtn.addEventListener('click', (e) => {
            e.preventDefault();
            createAccountModal.classList.add('active');
        });

        // Open Forgot Password Modal
        forgotPasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            forgotPasswordModal.classList.add('active');
        });

        // Close Modal Functions
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
            }
        }

        // Close button clicks
        closeButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const modalId = btn.getAttribute('data-modal');
                closeModal(modalId);
            });
        });

        // Cancel button clicks
        cancelButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (btn.getAttribute('data-modal')) {
                    e.preventDefault();
                    const modalId = btn.getAttribute('data-modal');
                    closeModal(modalId);
                }
            });
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === createAccountModal) {
                closeModal('createAccountModal');
            }
            if (e.target === forgotPasswordModal) {
                closeModal('forgotPasswordModal');
            }
        });

        // Form Handlers
        const loginForm = document.getElementById('loginForm');
        const createAccountForm = document.getElementById('createAccountForm');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const successMessage = document.getElementById('successMessage');

        // Login Form Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('emailError');

            // Clear previous errors
            emailError.classList.remove('show');
            emailError.textContent = '';

            if (!email) {
                emailError.textContent = 'Please enter a valid email or username';
                emailError.classList.add('show');
                return;
            }

            // Simulate successful login (no password required)
            showSuccessMessage('Sign in successful! Redirecting...');
            loginForm.reset();

            // Simulate redirect after 2 seconds
            setTimeout(() => {
                alert('Welcome to Google Classroom! This is a demo page.');
            }, 2000);
        });

        // Create Account Form Handler
        createAccountForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const newEmail = document.getElementById('newEmail').value.trim();

            // Clear previous errors
            clearErrors(['firstNameError', 'lastNameError', 'newEmailError']);

            let isValid = true;

            if (!firstName) {
                showError('firstNameError', 'First name is required');
                isValid = false;
            }

            if (!lastName) {
                showError('lastNameError', 'Last name is required');
                isValid = false;
            }

            if (!newEmail || !isValidEmail(newEmail)) {
                showError('newEmailError', 'Please enter a valid email');
                isValid = false;
            }

            if (isValid) {
                showSuccessMessage(`Account created for ${firstName} ${lastName}! Closing modal...`);
                setTimeout(() => {
                    closeModal('createAccountModal');
                    createAccountForm.reset();
                }, 2000);
            }
        });

        // Forgot Password Form Handler
        forgotPasswordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const resetEmail = document.getElementById('resetEmail').value.trim();
            const resetEmailError = document.getElementById('resetEmailError');

            resetEmailError.classList.remove('show');
            resetEmailError.textContent = '';

            if (!resetEmail || !isValidEmail(resetEmail)) {
                resetEmailError.textContent = 'Please enter a valid email';
                resetEmailError.classList.add('show');
                return;
            }

            showSuccessMessage(`Password reset link sent to ${resetEmail}. Closing modal...`);
            setTimeout(() => {
                closeModal('forgotPasswordModal');
                forgotPasswordForm.reset();
            }, 2000);
        });

        // Helper Functions
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$|^[a-zA-Z0-9._-]+$/;
            return emailRegex.test(email);
        }

        function showError(errorId, message) {
            const errorEl = document.getElementById(errorId);
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
            }
        }

        function clearErrors(errorIds) {
            errorIds.forEach(id => {
                const errorEl = document.getElementById(id);
                if (errorEl) {
                    errorEl.textContent = '';
                    errorEl.classList.remove('show');
                }
            });
        }

        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
